name: Product Ad From Image URLs
on:
  workflow_dispatch:
    inputs:
      image_urls: {type: string, required: true, description: '1-6 direct HTTPS image URLs, one per line; optional Front | URL labels'}
      product: {type: string, required: true}
      brand: {type: string, default: ''}
      hook: {type: string, default: ''}
      benefits: {type: string, default: '', description: 'Verified benefits separated by | (maximum 3)'}
      offer: {type: string, default: ''}
      cta: {type: string, default: 'Discover more'}
      duration: {type: choice, default: '15', options: ['15','30']}
      resolution: {type: choice, default: 720p, options: [720p,1080p]}
      voice: {type: boolean, default: false}
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Tests and real MP4 smoke encode
        env:
          PHOTO_AD_SMOKE: '1'
        run: python -m pytest -q tests/test_product_ad.py tests/test_ad_sources.py
      - name: Build one ad from every supplied angle
        env:
          IMAGE_URLS: ${{ inputs.image_urls }}
          PRODUCT: ${{ inputs.product }}
          BRAND: ${{ inputs.brand }}
          HOOK: ${{ inputs.hook }}
          BENEFITS: ${{ inputs.benefits }}
          OFFER: ${{ inputs.offer }}
          CTA: ${{ inputs.cta }}
          DURATION: ${{ inputs.duration }}
          RESOLUTION: ${{ inputs.resolution }}
          VOICE: ${{ inputs.voice }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import product_ad as ads
          from ad_sources import prepare_inputs,cover_angles
          photos,manifest=prepare_inputs([],os.environ['IMAGE_URLS'])
          plan=ads.make_plan(os.environ['PRODUCT'],os.environ['BENEFITS'].split('|'),os.environ['OFFER'],os.environ['CTA'],os.environ['HOOK'],os.environ['BRAND'])
          plan=cover_angles(plan,len(photos))
          folder=ads.render(photos,plan,'output_ads',int(os.environ['DURATION']),os.environ['RESOLUTION'],voice=os.environ['VOICE'].lower()=='true')
          (folder/'input-angles.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
      - name: Download product ad and storyboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-angle-ad-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_ads/
          if-no-files-found: warn
          retention-days: 7
