name: Product Ad Video - Rotation and Presenter Controls
on:
  workflow_dispatch:
    inputs:
      input_mode: {type: choice, default: inbox, options: [inbox,repository_image], description: 'Choose inbox to automatically use all 4 photos from the inbox folder'}
      product_name: {type: string, default: 'Rocky Vapor - Watermelon Berries'}
      main_words: {type: string, default: 'Special Deal', description: 'Offer text overlay'}
      duration: {type: choice, default: '10', options: ['10','15','20']}
      quality: {type: choice, default: 720p, options: [720p,1080p]}
      music: {type: choice, default: 'on', options: ['off','on']}
permissions:
  contents: read
concurrency:
  group: product-video-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools and background removal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m pip install 'rembg==2.0.59' onnxruntime
      - name: Render crisp multi-angle product ad with background removal
        env:
          PRODUCT: ${{ inputs.product_name }}
          OFFER: ${{ inputs.main_words }}
          DURATION: ${{ inputs.duration }}
          QUALITY: ${{ inputs.quality }}
          MUSIC: ${{ inputs.music }}
        run: |
          python inbox_video.py --input-mode=inbox --product-name="$PRODUCT" --main-words="$OFFER" --duration="$DURATION" --quality="$QUALITY" --music="$MUSIC"
      - name: Download product ad video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-video-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_free3d/
          if-no-files-found: warn
          retention-days: 7
